[project]
name = "udms"
version = "0.1.0"
description = "Uber Data Managment System"
authors = [
    {name = "Alireza Khalilian"}
]
readme = "README.md"
requires_python = ">=3.11,<4.0"
dependencies = [
    "duckdb (>=1.4.4,<2.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "dbt-duckdb (>=1.10.0,<2.0.0)",
    "jupyterlab (>=4.5.4,<5.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "fastapi (>=0.129.0,<0.130.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "streamlit (>=1.54.0,<2.0.0)",
    "langchain (>=1.2.10,<2.0.0)",
    "openai (>=2.20.0,<3.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "chromadb (>=1.5.0,<2.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
